    <g font-size="11" fill="#56636e" text-anchor="middle"><text x="47" y="150">01</text><text x="47" y="177">02</text><text x="47" y="203">03</text><text x="47" y="229">04</text></g>
    <g font-size="14" fill="#315d80" font-family="Segoe Print, Bradley Hand, cursive" font-style="italic"><text x="80" y="150">Ask a precise question.</text><text x="80" y="177">Go back to the source.</text><text x="80" y="203">Make it work.</text><text x="80" y="229">Keep a note. Try again.</text></g>
    <g fill="none" stroke="#315d80" stroke-width="1.5"><path d="M492 145l4 5 9-11M492 172l4 5 9-11M492 198l4 5 9-11M492 224l4 5 9-11"/></g>
